<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#05070a">

  <meta
    name="description"
    content="Body Tracker con seguimiento simultáneo de manos, caras y cuerpos."
  >

  <title>Body Tracker multipersona</title>

  <!-- Conexión anticipada para cargar MediaPipe más rápido -->
  <link
    rel="preconnect"
    href="https://cdn.jsdelivr.net"
    crossorigin
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main id="container">

    <!-- Plataforma detectada -->
    <div id="platformBadge">AUTO</div>

    <!-- Cámara -->
    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <!-- Seguimiento de cuerpos, caras y manos -->
    <canvas id="canvas"></canvas>

    <!-- Flash de captura automática -->
    <div
      id="flash"
      aria-hidden="true"
    ></div>

    <!-- Última captura automática -->
    <img
      id="miniaturaCaptura"
      alt="Última captura automática"
      title="Toca para abrir la última captura"
    >

    <!-- Información superior -->
    <header id="topBar">
      <h1>BODY TRACKER</h1>

      <p
        id="status"
        role="status"
        aria-live="polite"
      >
        Cámara detenida
      </p>

      <p class="instruccion">
        👥 Seguimiento simultáneo de varias personas.
        Forma un marco con el índice y el pulgar de tus dos
        manos para realizar una captura automática.
      </p>

      <p
        id="gestureIndicator"
        class="gesto-detectado"
        aria-live="polite"
      ></p>
    </header>

    <!-- Selector de filtros -->
    <div
      id="controlsPanel"
      class="controls-panel"
    >
      <label
        class="sr-only"
        for="filterSelect"
      >
        Seleccionar filtro de cámara
      </label>

      <select
        id="filterSelect"
        title="Filtros de cámara"
      >
        <option value="none">
          🎨 Sin filtro
        </option>

        <option value="grayscale">
          ⚫ Escala de grises
        </option>

        <option value="sepia">
          🟤 Sepia
        </option>

        <option value="invert">
          🟡 Negativo
        </option>

        <option value="blur">
          🌫️ Desenfoque
        </option>

        <option value="night">
          🌙 Modo noche
        </option>

        <option value="thermal">
          🌡️ Térmico simulado
        </option>

        <option value="mirror">
          🪞 Voltear imagen
        </option>
      </select>
    </div>

    <!-- Botones -->
    <nav
      class="buttons"
      aria-label="Controles de cámara"
    >
      <button
        id="startButton"
        type="button"
      >
        📷 Iniciar cámara
      </button>

      <button
        id="switchButton"
        type="button"
        disabled
      >
        🔄 Cambiar cámara
      </button>

      <button
        id="fullscreenButton"
        type="button"
      >
        ⛶ Pantalla completa
      </button>
    </nav>

  </main>

  <!--
    El app.js utiliza importaciones de MediaPipe.
    Por eso es obligatorio utilizar type="module".
  -->
  <script type="module" src="./app.js"></script>
</body>
</html>
