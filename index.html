<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#05070a">

    <title>Body Tracker</title>

    <link rel="stylesheet" href="style 2.css">
</head>

<body>

<div id="container">

    <div id="platformBadge">AUTO</div>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

    <div id="flash"></div>

    <img
        id="miniaturaCaptura"
        alt="Captura"
    >

    <div id="topBar">

        <h1>BODY TRACKER</h1>

        <p id="status">
            Cámara detenida
        </p>

        <p class="instruccion">
            🤏 Junta índice y pulgar de ambas manos
            para crear el cuadro de captura.
        </p>

    </div>

    <div class="buttons">

        <button id="startButton">
            📷 Iniciar cámara
        </button>

        <button id="switchButton">
            🔄 Cambiar cámara
        </button>

        <button id="fullscreenButton">
            ⛶ Pantalla completa
        </button>

    </div>

</div>


<!-- MediaPipe Pose -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>


<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>


<!-- MediaPipe Face Mesh -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>


<script src="app 2.js"></script>

</body>
</html>
