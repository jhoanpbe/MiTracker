<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Mi Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="container">

        <!-- CÁMARA -->
        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <!-- CAPA DE PUNTOS Y LÍNEAS -->
        <canvas id="canvas"></canvas>

        <!-- INFORMACIÓN -->
        <div id="topBar">

            <h1>Seguimiento humano</h1>

            <p id="status">
                Cámara detenida
            </p>

            <p id="stats">
                Listo
            </p>

        </div>

        <!-- BOTONES -->
        <div class="buttons">

            <button
                id="startButton"
                type="button"
            >
                📷 Iniciar cámara
            </button>

            <button
                id="switchButton"
                type="button"
            >
                🔄 Cambiar cámara
            </button>

        </div>

    </main>


    <!-- MEDIAPIPE POSE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js">
    </script>

    <!-- MEDIAPIPE HANDS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js">
    </script>


    <!-- TU PROGRAMA -->
    <script src="app.js"></script>


    <!-- SERVICE WORKER -->
    <script>

        if (
            "serviceWorker" in navigator &&
            location.protocol === "https:"
        ) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .catch(error => {

                        console.warn(
                            "Service Worker:",
                            error
                        );

                    });

            });

        }

    </script>

</body>
</html>
