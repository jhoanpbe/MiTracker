<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mi Tracker</h1>

    <div id="container">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <canvas id="canvas"></canvas>

    </div>

    <div class="buttons">

        <button id="startButton">
            📷 Iniciar cámara
        </button>

        <button id="switchButton">
            🔄 Cambiar cámara
        </button>

    </div>

    <p id="status">
        Cámara detenida
    </p>


    <!-- Detector del cuerpo -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

    <!-- Detector de manos -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <!-- Nuestro programa -->
    <script src="app.js"></script>

</body>

</html>
