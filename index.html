<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#05070a">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Mi Tracker</title>

    <link rel="stylesheet" href="style 2.css">
</head>

<body>

<div id="container" data-platform="auto">

    <!-- Indicador de plataforma -->
    <div id="platformBadge"></div>

    <!-- Cámara -->
    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <!-- Canvas del seguimiento -->
    <canvas id="canvas"></canvas>

    <!-- Efecto de captura -->
    <div id="flash"></div>

    <!-- Miniatura -->
    <img
        id="miniaturaCaptura"
        alt="Última captura">

    <!-- Enlace de descarga -->
    <a
        id="descargaCaptura"
        style="display:none;">
    </a>

    <!-- HUD superior -->
    <div id="topBar">

        <h1>Seguimiento humano</h1>

        <p id="status">
            Cámara detenida
        </p>

        <p class="instruccionCaptura">
            🤏 Extiende pulgar e índice de ambas manos
            para formar un cuadro
        </p>

    </div>

    <!-- Controles -->
    <div class="buttons">

        <button id="startButton">
            📷 Iniciar cámara
        </button>

        <button id="switchButton">
            🔄 Cambiar cámara
        </button>

        <button
            id="fullscreenButton"
            type="button">
            ⛶ Pantalla completa
        </button>

    </div>

</div>


<!-- ================================
     MEDIAPIPE POSE
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>


<!-- ================================
     MEDIAPIPE HANDS
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>


<!-- ================================
     PROGRAMA
================================ -->

<script src="app 2.js"></script>

</body>
</html>
